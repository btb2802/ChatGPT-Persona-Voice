name: Codex Implement Windows AMD ROCm

on:
  push:
    branches: [feature/windows-amd-rocm-ryzen-ai]
    paths:
      - scripts/.codex-implement-rocm.py.gz.b64
      - .github/workflows/codex-implement-rocm.yml

permissions:
  contents: write

concurrency:
  group: codex-implement-rocm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement:
    name: Implement and verify AMD ROCm profile
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"

      - name: Install frozen JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Decode implementation worker
        shell: pwsh
        run: |
          python -c "import base64,gzip,pathlib; source=pathlib.Path('scripts/.codex-implement-rocm.py.gz.b64'); pathlib.Path('scripts/codex-implement-rocm.py').write_bytes(gzip.decompress(base64.b64decode(source.read_text(encoding='utf-8'))))"
          python -m py_compile scripts/codex-implement-rocm.py

      - name: Write tests first
        run: python scripts/codex-implement-rocm.py tests

      - name: Prove the new tests are red
        shell: pwsh
        run: |
          node --test tests/seed-vc-rocm-profile.test.cjs
          $redExit = $LASTEXITCODE
          if ($redExit -eq 0) {
            throw "The ROCm tests unexpectedly passed before implementation"
          }
          Write-Host "TDD red phase confirmed with exit code $redExit"
          exit 0

      - name: Apply implementation
        run: python scripts/codex-implement-rocm.py implementation

      - name: Generate the complete hash-locked ROCm environment
        shell: pwsh
        run: |
          uv python install 3.12
          uv pip compile engine/seed-vc/requirements-windows-x64-rocm.in `
            --python 3.12 `
            --generate-hashes `
            --output-file engine/seed-vc/requirements-windows-x64-rocm.lock.txt

      - name: Validate a clean Python 3.12 ROCm sync transaction
        shell: pwsh
        run: |
          uv venv --python 3.12 .tmp-rocm-venv
          uv pip sync `
            --dry-run `
            --managed-python `
            --strict `
            --require-hashes `
            --only-binary :all: `
            --no-binary antlr4-python3-runtime `
            --no-binary argbind `
            --no-binary randomname `
            --no-binary rocm `
            --build-constraint engine/seed-vc/requirements-windows-x64-rocm.lock.txt `
            --link-mode copy `
            --default-index https://pypi.org/simple `
            --python .tmp-rocm-venv/Scripts/python.exe `
            engine/seed-vc/requirements-windows-x64-rocm.lock.txt

      - name: Apply documentation
        run: python scripts/codex-implement-rocm.py docs

      - name: Run targeted ROCm and engine contracts
        run: node --test tests/seed-vc-rocm-profile.test.cjs tests/seed-vc-engine.test.cjs tests/engine-installer.test.cjs tests/model-integrity.test.cjs

      - name: Run the full contract suite
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build renderer
        run: bun run build:renderer

      - name: Check generated diff
        shell: pwsh
        run: |
          git diff --check
          git status --short

      - name: Commit verified implementation
        shell: pwsh
        env:
          BRANCH_NAME: feature/windows-amd-rocm-ryzen-ai
        run: |
          Remove-Item -Recurse -Force .tmp-rocm-venv -ErrorAction SilentlyContinue
          Remove-Item -Force scripts/codex-implement-rocm.py -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: add Windows AMD ROCm Seed-VC profile"
          git push origin "HEAD:$env:BRANCH_NAME"
